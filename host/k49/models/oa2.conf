# Kindle Oasis 2（9 代，zelda）：i.MX7D 双核 A7（996/792 MHz，默认 interactive），4.1.15（5.16 内核没有 PID 命名空间），512 MB，1264x1680 300 ppi，
# cyttsp5 协议 B（带压力 / 接触面积），实体翻页键 gpio-keys。只写和 old-base.conf 不同的。
MODEL_ID=oa2
SOC=imx7d
CPU_CORE=cortex-a7
CPU_CORES=2
RAM_MB=512
COMPILE_CHARGING_ONLY=0   # 双核：dex2oat 仍是单线程（低内存），另一个核留给前台
KFB_SETTLE=40
KFB_PACE=1
KFB_HZ=60
KFB_PWRDOWN=1500
G_WINDOW=22
BOOST_MS=1200
PAGE_KEYS=gpio-keys
PAGE_KEYS_SWAP=1          # 设备树（imx7d-zelda.dts）里 "Page Back" 发 KEY_PAGEDOWN(109)、"Page Forward" 发 KEY_PAGEUP(104)：对调后 Forward = 下一页
FL_COLD=max77796-bl
FL_WARM=none
KFB_DITHER=0              # Zelda EPDC（i.MX7D + PxP）：硬件抖动会让整块刷成黑的（Oasis 3 用户“灰度最准一大片黑”；KO3 / Oasis 2 模拟器 16 级灰测试全 0）。epd.c 在 Zelda 上也一律不开
MEM_KEEP=on               # vdkeep(swappiness=0) + vdsys(15) + vdpin 锁住 VeraHome 代码页，重 I/O 下下拉面板零缺页
INPUT_RT=4                # veradroid-input 实时调度 SCHED_FIFO 4，双核满载时触摸/手势仍即时抢占
READAHEAD_KB=64           # 大型 speed OAT 随机代码页缺页为主，64 KB 预读兼顾顺序吞吐并降低 4 倍页缓存污染
COMPILE_BIG_DEX_MB=512    # 满血 speed + Profile-Guided base.art 全量 AOT：不因 DEX 体积降级阅读器
COMPILE_IDLE_THREADS=2    # 双核 Cortex-A7 在空闲或手动优化时启用双线程并行 dex2oat（耗时减半，远离 PM 10m 看门狗）
APP_PREFAULT_HEAD_MB=8    # 开机空闲预读 base.art 全文件 + base.odex 前 8 MB 索引头，加速冷启动类查找
PERF_TUNE=1               # 启用 i.MX7D 双核 A7 专属调频与块队列调优（不影响 PW6/4.9 机型默认功耗基线）

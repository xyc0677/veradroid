# Kindle Oasis 3（10 代，cognac，设备树兼容串也是 imx7d-zelda）：i.MX7D 双核 A7（996/792 MHz，默认 interactive），4.1.15（有命名空间），512 MB − 5 MB EPDC，1264x1680 300 ppi，
# cyttsp5 协议 B（带压力 / 接触面积），实体翻页键 gpio-keys。只写和 old-base.conf 不同的。
MODEL_ID=ko3
SOC=imx7d
CPU_CORE=cortex-a7
CPU_CORES=2
RAM_MB=512
COMPILE_CHARGING_ONLY=0   # 双核：dex2oat 仍是单线程（低内存），另一个核留给前台
KFB_SETTLE=40
KFB_PACE=1
KFB_HZ=60
KFB_PWRDOWN=1500
G_WINDOW=22
BOOST_MS=450
PAGE_KEYS=gpio-keys
PAGE_KEYS_SWAP=1          # 设备树（imx7d-cognac.dts）里同样 "Page Back" 发 KEY_PAGEDOWN(109)、"Page Forward" 发 KEY_PAGEUP(104)：对调后 Forward = 下一页
FL_COLD=lm3697-bl1        # 冷光；暖光 lm3697-bl0 由 powerd 的 currentAmberLevel 管
FL_WARM=lipc
KFB_DITHER=0              # Zelda EPDC（i.MX7D + PxP）：硬件抖动会让整块刷成黑的（Oasis 3 用户“灰度最准一大片黑”；KO3 / Oasis 2 模拟器 16 级灰测试全 0）。epd.c 在 Zelda 上也一律不开
PERF_TUNE=1               # 启用 i.MX7D 双核 A7 专属调频与块队列调优（不影响 PW6/4.9 机型默认功耗基线）

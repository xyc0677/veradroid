# 每个应用的显示设置：内置推荐（appprof.sh）。三个宿主（pw6 / k49 / legacy）共用同一份。
# 格式：<包名>[*] KEY=v;KEY=v    末尾 * = 前缀匹配；用户在“当前应用的显示设置”里存的会整行代替这里的。
# 只放刷新方式 / 全刷周期 / 快速滑动 / 图片灰度：不改对比度（换应用时显示桥要整屏重画一遍），不改翻页动画。
#   KFB_MODE=1     灰度最准：字边缘和灰度最好，翻页仍是不闪的 REAGL（epd.c）
#   KFB_FLASH=N    每翻 N 页整屏闪刷一次清残影
#   KFB_SCROLLDU=300  快速滑动：滚动时先黑白快刷，停下 0.3 秒再补 16 级灰度
#   KFB_IMG=25     图片灰度：小块变化里图片多的用 GL16 灰度，不用黑白点阵（均衡方式下有效）
# 老机型（legacy）的显示桥没有快速滑动 / 图片灰度，这两项在那里不起作用。
#   DENSITY=auto1080  这个应用在前台时把系统显示密度临时换成 320 × 屏宽 / 1080（多看自己按这个算阅读页，系统是 300 时字出屏幕）；
#                     也可以写数字。离开 / 返回 Kindle / 停止 / 开机都回到默认（appprof.sh）。不是显示桥的参数，用户的设置里没有这一项。


# 应用瘦身清单（appslim.sh）。host/pw6、host/k49 两份完全相同（tests/appslim-test.sh 核对）。
# 一行一条：<包名> <versionCode 范围> @default=lowmem|on|off   或   <包名> <versionCode 范围> <组件完整类名>
# 范围：74532 | 70000-79999 | 74532- | -79999 | *。新版本里没有的组件自动跳过；不在任何范围里的版本什么都不做。
# 只放服务 / 接收器 / 内容提供器，而且每一组都在模拟器上实测过（关掉以后书城、打开书、读一章、翻页、登录页都还正常）。
# 实测记录见 docs/appslim.md。

# ---- 番茄免费小说 7.4.5（74532）----
# 只停自己单独开进程的后台部件：推送（:push 字节推送 / 长连接，:pushservice 小米 / 华为推送，:smp 推送联盟“拉活”），
# 桌面小部件进程（:widgetProvider，VeraDroid 没有小部件宿主）、日志上传（:uploadLogProcess）、内存报告上传（:apm_memory_upload）、
# 热更新静默安装（:mist）、:depths_disable_art_image_process（保活）。主进程里的组件一个都不动（书城、阅读、登录、支付、网页都在主进程）。
# 不停：:downloader（下载器，可能下插件 / 听书）、:sandboxed_process* / :privileged_process*（字节自带网页内核的渲染进程）、
#   :miniapp* / :minigame*（只在用户点开小游戏时才起）、:plugin1 / :stubp*（插件 / 热更新的占位组件）。
